<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0605f">
<title data-i18n="appTitle">勤務カレンダー</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --work: #222222;
    --off: #d42a2a;
    --accent: #e0605f;
    --title: #b8662a;
    --line: #eee2e3;
    --muted: #888;
    --bg: #f4f4f6;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--work);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "M PLUS Rounded 1c", "Meiryo", "Yu Gothic", "Noto Sans Sinhala", "Iskoola Pota", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- ページ切り替えリンク ---------- */
  .pagenav {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(6px + env(safe-area-inset-top)) 16px 6px; background: #fbeaea; border-bottom: 1px solid #f1cfcf;
    font-size: 13px; color: #8a4a3a;
  }
  .pagenav .here { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pagenav select {
    font: inherit; font-size: 13px; padding: 3px 6px; color: #8a4a3a;
    border: 1px solid #e8a7a2; border-radius: 999px; background: #fff;
  }
  .pagenav a {
    color: #c0392b; font-weight: 700; text-decoration: none;
    padding: 4px 12px; border: 1px solid #e8a7a2; border-radius: 999px; background: #fff;
    white-space: nowrap;
  }
  .pagenav a:hover { background: #fff5f4; }

  /* ---------- ヘッダー ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid #ddd;
    padding: 8px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .titles { flex: 1; min-width: 0; color: var(--title); }
  .titles .main { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titles .sub { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button {
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: #fff; color: var(--accent);
    white-space: nowrap;
  }
  header button.primary { background: var(--accent); color: #fff; }
  header button:disabled { cursor: default; color: #ecc9c8; border-color: #f3dddd; background: #fff; }
  header button.primary:disabled { background: #f0b3b2; border-color: #f0b3b2; color: #fff; }
  header button.arrow {
    width: 38px; height: 38px; padding: 0 0 3px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; line-height: 1;
  }
  header .titles { text-align: center; }
  header .titles .main { white-space: normal; font-size: 14px; line-height: 1.25; }

  main { max-width: 520px; margin: 0 auto; padding: 12px 16px 40px; }

  /* ---------- 月カード ---------- */
  .month {
    background: var(--card); border-radius: 12px;
    padding: 12px 10px 8px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    scroll-margin-top: 72px;
  }
  .month-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; }
  .month-num {
    background: var(--accent); color: #fff; font-weight: 700;
    min-width: 36px; height: 34px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; border-radius: 4px;
  }
  .month-year { font-size: 13px; color: var(--muted); }
  .month-count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .month-count b { color: var(--work); }
  .month-count b.off { color: var(--off); }
  .month.current .month-head::after {
    content: attr(data-badge); order: 2; white-space: nowrap; font-size: 11px; font-weight: 700;
    color: #fff; background: var(--title); padding: 2px 7px; border-radius: 999px;
  }
  .month.current .month-count { order: 3; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 6px; border-bottom: 1px solid var(--line); }
  .dow.red { color: var(--off); }
  .day {
    height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 19px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative;
  }
  .day.off { color: var(--off); }
  .day.blank { cursor: default; }
  .day .n { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .day.today .n { box-shadow: inset 0 0 0 2px var(--title); font-weight: 700; }
  .day .hol { position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--off); }

  /* ---------- 未読込時 ---------- */
  .empty { text-align: center; padding: 48px 8px; color: #555; line-height: 1.8; font-size: 15px; }
  .empty button {
    font: inherit; font-size: 16px; font-weight: 600; margin-top: 16px;
    padding: 12px 22px; border-radius: 999px; border: none; background: var(--accent); color: #fff;
  }
  .legend { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 12px; }
  .legend b { color: var(--work); }
  .legend b.off { color: var(--off); }
  .empty a {
    display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
  }
  .empty button.secondary, .footer button {
    font: inherit; font-size: 14px; font-weight: 600; margin-top: 12px;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: #fff; color: var(--accent);
  }
  .footer { text-align: center; padding: 8px 0 24px; font-size: 12px; color: var(--muted); }
  .footer p { margin: 0; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
    width: max-content; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: .94; }
</style>
</head>
<body>

<nav class="pagenav">
  <span class="here" data-i18n="viewerHere">閲覧ページ</span>
  <select id="langSel" aria-label="Language"></select>
  <a href="index.html" id="toEditor" data-i18n="toEditor">編集ページへ</a>
</nav>
<header>
  <button id="prevBtn" class="arrow" disabled data-i18n-title="prevYear">‹</button>
  <div class="titles">
    <div class="main" id="titleOut">勤務カレンダー</div>
    <div class="sub" id="subOut"></div>
  </div>
  <button id="nextBtn" class="arrow" disabled data-i18n-title="nextYear">›</button>
  <button id="todayBtn" class="primary" disabled data-i18n="thisMonth">今月</button>
</header>

<main id="main"></main>
<input id="fileIn" type="file" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
(() => {
  'use strict';
  const I = window.JC_I18N;
  const t = I.t;
  const { pad, keyOfDate, monthsOf, holidayName, isOff, fiscalYearOf } = window.JC;
  const $ = id => document.getElementById(id);

  let calendars = {};   // 保存済みの全年度
  let years = [];       // 保存済みの年度（昇順）
  let year = null;      // 表示中の年度

  function reload() {
    calendars = window.JC.loadAll();
    years = Object.keys(calendars).map(Number).sort((a, b) => a - b);
  }

  // 今年度があればそれ、なければいちばん近い年度
  function defaultYear() {
    const fy = fiscalYearOf();
    if (calendars[fy]) return fy;
    return years.reduce((best, y) =>
      best === null || Math.abs(y - fy) < Math.abs(best - fy) || (Math.abs(y - fy) === Math.abs(best - fy) && y > best) ? y : best, null);
  }

  // ================= 描画 =================
  function updateNav() {
    // 編集ページは表示中の年度で開く
    $('toEditor').href = year === null ? 'index.html' : `index.html?year=${year}`;
    const idx = years.indexOf(year);
    $('prevBtn').disabled = idx <= 0;
    $('nextBtn').disabled = idx < 0 || idx >= years.length - 1;
    $('todayBtn').disabled = year === null;
  }

  function renderEmpty() {
    year = null;
    $('titleOut').textContent = t('appTitle');
    $('subOut').textContent = '';
    document.title = t('appTitle');
    $('main').innerHTML = `
      <div class="empty">
        <p>${t('emptyMsg')}</p>
        <a href="index.html">${t('openEditor')}</a>
        <p style="font-size:13px;color:#888;margin-top:28px">${t('emptyNote')}</p>
        <button type="button" class="secondary" id="emptyImport">${t('importFile')}</button>
      </div>`;
    $('emptyImport').addEventListener('click', () => $('fileIn').click());
    updateNav();
  }

  function render() {
    if (year === null || !calendars[year]) { renderEmpty(); return; }
    const data = calendars[year];
    const overrides = new Set(data.overrides);

    // 自動タイトルのままなら表示中の言語に合わせる
    const title = !data.title || I.isAutoTitle(data.title, year) ? t('autoTitle', year) : data.title;
    $('titleOut').textContent = title;
    $('subOut').textContent = data.subtitle;
    document.title = [title, data.subtitle].filter(Boolean).join(' ');
    const DOW = t('dow');

    const today = new Date();
    const todayKey = keyOfDate(today);
    const main = $('main');
    main.textContent = '';

    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = t('legend');
    main.appendChild(legend);

    for (const { y, m } of monthsOf(year)) {
      const sec = document.createElement('section');
      sec.className = 'month';
      sec.id = `m-${y}-${pad(m)}`;
      if (y === today.getFullYear() && m === today.getMonth() + 1) sec.classList.add('current');

      const cal = document.createElement('div');
      cal.className = 'cal';
      DOW.forEach((w, i) => {
        const c = document.createElement('div');
        c.className = 'dow' + (i === 0 || i === 6 ? ' red' : '');
        c.textContent = w;
        cal.appendChild(c);
      });

      const first = new Date(y, m - 1, 1);
      const days = new Date(y, m, 0).getDate();
      for (let i = 0; i < first.getDay(); i++) {
        const c = document.createElement('div'); c.className = 'day blank'; cal.appendChild(c);
      }
      let work = 0, off = 0;
      for (let d = 1; d <= days; d++) {
        const dt = new Date(y, m - 1, d);
        const offDay = isOff(dt, overrides);
        offDay ? off++ : work++;
        const c = document.createElement('div');
        c.className = 'day' + (offDay ? ' off' : '') + (keyOfDate(dt) === todayKey ? ' today' : '');
        const hn = I.holiday(holidayName(dt));
        c.innerHTML = `<span class="n">${d}</span>${hn ? '<span class="hol"></span>' : ''}`;
        c.dataset.info = t('dayInfo', m, d, DOW[dt.getDay()], hn, offDay);
        cal.appendChild(c);
      }

      const head = document.createElement('div');
      head.className = 'month-head';
      head.innerHTML = `<div class="month-num">${m}</div><div class="month-year">${t('monthYear', y)}</div>
        <div class="month-count">${t('monthCount', work, off)}</div>`;
      if (sec.classList.contains('current')) head.dataset.badge = t('thisMonth');
      sec.appendChild(head);
      sec.appendChild(cal);
      main.appendChild(sec);
    }

    const footer = document.createElement('div');
    footer.className = 'footer';
    footer.innerHTML = `<p>${t('importNote')}</p><button type="button" id="footerImport">${t('importFile')}</button>`;
    main.appendChild(footer);
    $('footerImport').addEventListener('click', () => $('fileIn').click());
    updateNav();
  }

  function show(y) {
    year = y;
    render();
    window.scrollTo(0, 0);
  }

  // ================= 操作 =================
  $('main').addEventListener('click', e => {
    const c = e.target.closest('.day[data-info]');
    if (c) toast(c.dataset.info);
  });

  $('prevBtn').addEventListener('click', () => { const i = years.indexOf(year); if (i > 0) show(years[i - 1]); });
  $('nextBtn').addEventListener('click', () => { const i = years.indexOf(year); if (i >= 0 && i < years.length - 1) show(years[i + 1]); });

  $('todayBtn').addEventListener('click', () => {
    const now = new Date();
    const sec = document.getElementById(`m-${now.getFullYear()}-${pad(now.getMonth() + 1)}`);
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else toast(t('outOfRange'));
  });

  // 他の端末で書き出したファイルを取り込む（その年度として保存）
  $('fileIn').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    let d;
    try {
      d = window.JC.normalize(JSON.parse(await f.text()));
    } catch (err) {
      alert(t('loadError'));
      return;
    }
    if (!window.JC.saveCalendar(d)) { alert(t('saveFailed')); return; }
    reload();
    show(d.startYear);
    toast(t('loaded', d.startYear));
  });

  // 同じ端末の別タブで編集ページが保存したら表示を更新
  window.addEventListener('storage', e => {
    if (e.key !== window.JC.CAL_KEY) return;
    reload();
    if (year === null || !calendars[year]) year = defaultYear();
    render();
  });

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ================= 起動 =================
  I.bindSelect($('langSel'));
  I.applyStatic();
  I.onChange(render);

  // オフライン対応（Webで公開している場合のみ有効）
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  reload();
  // ?year= で指定された年度（編集ページから来たとき）が保存済みならそれ、なければ今年度
  const reqYear = Number(new URLSearchParams(location.search).get('year'));
  year = calendars[reqYear] ? reqYear : defaultYear();
  render();
})();
</script>
</body>
</html>
