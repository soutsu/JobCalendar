<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="editorHere">勤務カレンダー作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --work: #222222;
    --off: #d42a2a;
    --work-faint: #c4c4c4;
    --off-faint: #efb3b3;
    --accent: #e0605f;
    --title: #b8662a;
    --rule: #f0a6b3;
    --grid: #ecd3d6;
    --ui-bg: #e9e9ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ui-bg);
    color: #222;
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", "Yu Gothic", "Noto Sans Sinhala", "Iskoola Pota", sans-serif;
  }

  /* ---------- ページ切り替えリンク ---------- */
  .pagenav {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 16px; background: #fbeaea; border-bottom: 1px solid #f1cfcf;
    font-size: 13px; color: #8a4a3a;
  }
  .pagenav .here { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pagenav select {
    font: inherit; font-size: 13px; padding: 3px 6px; color: #8a4a3a;
    border: 1px solid #e8a7a2; border-radius: 999px; background: #fff;
  }
  .pagenav a {
    color: #c0392b; font-weight: 700; text-decoration: none;
    padding: 4px 12px; border: 1px solid #e8a7a2; border-radius: 999px; background: #fff;
    white-space: nowrap;
  }
  .pagenav a:hover { background: #fff5f4; }

  /* ---------- 操作パネル（印刷されません） ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid #d5d5da;
    padding: 10px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end;
    font-size: 14px;
  }
  .toolbar label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #555; }
  .toolbar input, .toolbar select {
    font: inherit; font-size: 14px; padding: 5px 8px;
    border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #222;
  }
  .toolbar input.title-input { width: 260px; max-width: 100%; }
  .toolbar .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .toolbar button {
    font: inherit; font-size: 14px; padding: 6px 12px; cursor: pointer;
    border: 1px solid #bbb; border-radius: 6px; background: #f7f7f9; color: #222;
  }
  .toolbar button:hover { background: #ececf0; }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar button.primary:hover { filter: brightness(0.95); }
  .status { width: 100%; font-size: 12px; color: #555; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .status b { color: #222; }
  .status .off { color: var(--off); }
  .save-state { font-weight: 700; color: #2e7d32; }
  .save-state.pending { color: #c0392b; }

  .stage { padding: 20px 16px 40px; display: flex; justify-content: center; }

  /* ---------- A4用紙 ---------- */
  .page {
    width: 210mm; height: 297mm;
    background: #fff;
    padding: 9mm 9mm 8mm;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
    overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page-title {
    display: flex; align-items: baseline; gap: 5mm;
    padding: 0 2mm 1.6mm;
    border-bottom: 0.6mm solid var(--rule);
    color: var(--title);
    min-height: 12mm;
  }
  .page-title .main { font-size: 20pt; font-weight: 500; letter-spacing: .02em; white-space: nowrap; }
  .page-title .sub { font-size: 14pt; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .months {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    column-gap: 7mm;
    row-gap: 2mm;
    padding-top: 4mm;
  }
  .month { display: flex; flex-direction: column; }
  .month-head { display: flex; align-items: flex-start; gap: 1.2mm; height: 7.5mm; }
  .month-num {
    background: var(--accent); color: #fff;
    min-width: 7.5mm; height: 7mm; padding: 0 .8mm;
    display: flex; align-items: center; justify-content: center;
    font-size: 15pt; font-weight: 500; line-height: 1;
  }
  .month-year { font-size: 5.5pt; color: #666; margin-top: .3mm; }
  .month-count { display: none; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal > div {
    height: 6.1mm;
    display: flex; align-items: center; justify-content: center;
    border-right: 0.25mm dotted var(--grid);
    border-bottom: 0.25mm dotted var(--grid);
    font-size: 11.5pt; line-height: 1;
    user-select: none;
  }
  .cal > div:nth-child(7n+1) { border-left: 0.25mm dotted var(--grid); }
  .cal > .dow { height: 5mm; font-size: 8.5pt; color: #555; border-top: 0.25mm dotted var(--grid); }
  .cal > .dow.sun, .cal > .dow.sat { color: var(--off); }

  .day { color: var(--work); cursor: pointer; }
  .day.off { color: var(--off); }
  .day.changed { font-weight: 700; }
  @media (hover: hover) { .day:hover { background: #fdeceb; } }
  .day.out { color: var(--work-faint); cursor: default; font-weight: 400; }
  .day.out.off { color: var(--off-faint); }
  @media (hover: hover) { .day.out:hover { background: none; } }
  .day.blank { cursor: default; }
  @media (hover: hover) { .day.blank:hover { background: none; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #333; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: .92; }

  /* ---------- 未保存の確認ダイアログ ---------- */
  dialog.confirm {
    border: none; border-radius: 12px; padding: 20px 18px 16px;
    width: min(360px, calc(100vw - 32px)); box-shadow: 0 8px 30px rgba(0,0,0,.25);
    font: inherit; color: #222;
  }
  dialog.confirm::backdrop { background: rgba(0,0,0,.35); }
  dialog.confirm p { margin: 0 0 16px; font-size: 15px; font-weight: 700; line-height: 1.5; }
  dialog.confirm .actions { display: flex; flex-direction: column; gap: 8px; }
  dialog.confirm button {
    font: inherit; font-size: 15px; padding: 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid #bbb; background: #f7f7f9; color: #222;
  }
  dialog.confirm button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog.confirm button.plain { border-color: transparent; background: none; color: #666; }

  /* ---------- スマホ表示（画面幅が狭いとき。印刷には影響しません） ---------- */
  @media screen and (max-width: 760px) {
    .toolbar { position: static; padding: 12px; gap: 10px; }
    .toolbar label { width: 100%; font-size: 13px; }
    .toolbar input.title-input, .toolbar select { width: 100%; font-size: 16px; padding: 8px 10px; }
    .toolbar .buttons { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toolbar button { padding: 11px 8px; font-size: 15px; }
    .status { font-size: 12px; }

    .stage { display: block; padding: 12px 10px 40px; }
    .page {
      width: auto; height: auto; overflow: visible;
      padding: 14px 10px 4px; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .page-title { flex-wrap: wrap; gap: 2px 10px; min-height: 0; padding: 0 4px 8px; border-bottom-width: 2px; }
    .page-title .main { font-size: 18px; white-space: normal; }
    .page-title .sub { font-size: 14px; white-space: normal; }

    .months { display: block; padding-top: 14px; }
    .month { margin-bottom: 22px; }
    .month-head { height: auto; align-items: center; gap: 8px; margin-bottom: 6px; padding: 0 2px; }
    .month-num { min-width: 36px; height: 34px; font-size: 21px; border-radius: 4px; }
    .month-year { font-size: 13px; margin: 0; }
    .month-count { display: block; margin-left: auto; font-size: 12px; color: #888; }
    .month-count b { color: var(--work); }
    .month-count b.off { color: var(--off); }

    .cal > div { height: 46px; font-size: 19px; border-width: 1px; }
    .cal > .dow { height: 28px; font-size: 12px; }
  }

  /* ---------- 印刷 ---------- */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .toolbar, .toast, .pagenav { display: none !important; }
    .stage { padding: 0; display: block; }
    .page { box-shadow: none; zoom: 1 !important; height: 296.5mm; page-break-after: avoid; }
    .day:hover { background: none; }
    .day.changed { font-weight: inherit; }
    .month-count { display: none !important; }
  }
</style>
</head>
<body>

<nav class="pagenav">
  <span class="here" data-i18n="editorHere">勤務カレンダー作成</span>
  <select id="langSel" aria-label="Language"></select>
  <a href="viewer.html" id="toViewer" data-i18n="toViewer">閲覧ページへ</a>
</nav>

<div class="toolbar">
  <label><span data-i18n="yearLabel">年度（4月始まり）</span>
    <select id="yearSel"></select>
  </label>
  <label><span data-i18n="titleLabel">タイトル</span>
    <input id="titleIn" class="title-input" type="text">
  </label>
  <label><span data-i18n="subLabel">サブタイトル</span>
    <input id="subIn" class="title-input" type="text" data-i18n-placeholder="subPlaceholder">
  </label>
  <div class="buttons">
    <button id="saveBtn" class="primary" data-i18n="save" data-i18n-title="saveTip">保存</button>
    <button id="printBtn" data-i18n="print" data-i18n-title="printTip">印刷・PDF</button>
    <button id="shareBtn" data-i18n="shareQR" data-i18n-title="shareTip">QRコードで渡す</button>
    <button id="exportBtn" data-i18n="exportFile" data-i18n-title="exportTip">ファイルに書き出し</button>
    <button id="importBtn" data-i18n="importFile" data-i18n-title="importTip">ファイルから読み込み</button>
    <button id="resetBtn" data-i18n="reset" data-i18n-title="resetTip">初期状態に戻す</button>
  </div>
  <div class="status">
    <span id="saveState" class="save-state"></span>
    <span id="counts"></span>
    <span data-i18n-html="editorHelp"></span>
  </div>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
</div>

<div class="stage">
  <div class="page" id="page">
    <div class="page-title">
      <span class="main" id="titleOut"></span>
      <span class="sub" id="subOut"></span>
    </div>
    <div class="months" id="months"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<dialog class="confirm" id="leaveDlg">
  <p data-i18n="leaveTitle">変更があります。保存しますか？</p>
  <div class="actions">
    <button type="button" class="primary" value="save" data-i18n="leaveSave">保存して移動</button>
    <button type="button" value="discard" data-i18n="leaveDiscard">保存せずに移動</button>
    <button type="button" class="plain" value="cancel" data-i18n="cancel">キャンセル</button>
  </div>
</dialog>

<script src="vendor/qrcode.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="share.js"></script>
<script>
(() => {
  'use strict';
  const I = window.JC_I18N;
  const t = I.t;
  const { keyOfDate, monthsOf, holidayName, isOff, fiscalYearOf } = window.JC;

  // ================= 状態 =================
  const OLD_DRAFT_KEY = 'jobcalendar.current.v1';   // 旧版で使っていた編集途中の記憶（今は使わない）
  const state = {
    startYear: fiscalYearOf(),
    title: '',
    titleAuto: true,
    subtitle: '',
    overrides: new Set(),   // 既定状態から反転させた日付（YYYY-MM-DD）
  };

  const autoTitle = y => t('autoTitle', y);

  // 状態 → 保存データ
  function toData() {
    return {
      app: 'jobcalendar',
      version: 1,
      startYear: state.startYear,
      title: state.title,
      subtitle: state.subtitle,
      overrides: [...state.overrides].sort(),
    };
  }

  // 保存データ → 状態
  function setState(d) {
    state.startYear = d.startYear;
    state.title = d.title || autoTitle(d.startYear);
    state.titleAuto = I.isAutoTitle(state.title, d.startYear);
    if (state.titleAuto) state.title = autoTitle(d.startYear);   // 表示中の言語に合わせる
    state.subtitle = d.subtitle || '';
    state.overrides = new Set(d.overrides || []);
    if (![...yearSel.options].some(o => +o.value === state.startYear)) addYearOption(state.startYear);
    syncInputs();
  }

  // 比較用（自動タイトルは言語によらず同じものとみなす）
  const fingerprint = d => JSON.stringify([
    I.isAutoTitle(d.title, d.startYear) ? '' : d.title, d.subtitle || '', [...(d.overrides || [])].sort(),
  ]);
  const savedOf = y => window.JC.loadAll()[y] || null;
  function saveStatus() {
    const saved = savedOf(state.startYear);
    if (!saved) return 'new';
    return fingerprint(saved) === fingerprint(toData()) ? 'saved' : 'dirty';
  }
  // 保存していない変更があるか（未保存の年度は、日付やタイトルを変えた場合のみ）
  function hasUnsavedChanges() {
    const st = saveStatus();
    return st === 'dirty' || (st === 'new' && (state.overrides.size > 0 || !state.titleAuto));
  }

  // ================= 描画 =================
  const $ = id => document.getElementById(id);

  function render() {
    $('titleOut').textContent = state.title;
    $('subOut').textContent = state.subtitle;

    const wrap = $('months');
    wrap.textContent = '';
    let work = 0, off = 0, changed = 0;

    const DOW = t('dow');
    for (const { y, m } of monthsOf(state.startYear)) {
      const box = document.createElement('div');
      box.className = 'month';
      box.innerHTML = `<div class="month-head"><div class="month-num">${m}</div><div class="month-year">${y}</div></div>`;
      const cal = document.createElement('div');
      cal.className = 'cal';
      DOW.forEach((w, i) => {
        const c = document.createElement('div');
        c.className = 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
        c.textContent = w;
        cal.appendChild(c);
      });

      const first = new Date(y, m - 1, 1);
      const start = new Date(first); start.setDate(1 - first.getDay());
      const daysInMonth = new Date(y, m, 0).getDate();
      const weeks = Math.ceil((first.getDay() + daysInMonth) / 7);
      let mWork = 0, mOff = 0;

      for (let i = 0; i < 42; i++) {
        const dt = new Date(start); dt.setDate(start.getDate() + i);
        const c = document.createElement('div');
        c.className = 'day';
        if (i >= weeks * 7) {           // 6行に揃えるための空行
          c.classList.add('blank');
          cal.appendChild(c);
          continue;
        }
        const key = keyOfDate(dt);
        const inMonth = dt.getMonth() === m - 1;
        const offDay = isOff(dt, state.overrides);
        c.textContent = dt.getDate();
        if (offDay) c.classList.add('off');
        if (!inMonth) {
          c.classList.add('out');
        } else {
          c.dataset.key = key;
          if (state.overrides.has(key)) { c.classList.add('changed'); changed++; }
          c.title = t('dayInfo', m, dt.getDate(), DOW[dt.getDay()], I.holiday(holidayName(dt)), offDay);
          offDay ? (off++, mOff++) : (work++, mWork++);
        }
        cal.appendChild(c);
      }
      const head = box.querySelector('.month-head');
      const cnt = document.createElement('div');
      cnt.className = 'month-count';
      cnt.innerHTML = t('monthCount', mWork, mOff);
      head.appendChild(cnt);
      box.appendChild(cal);
      wrap.appendChild(box);
    }
    $('counts').innerHTML = t('totals', work, off, changed);

    const st = saveStatus();
    const el = $('saveState');
    el.textContent = t(st === 'saved' ? 'stateSaved' : st === 'dirty' ? 'stateDirty' : 'stateNew');
    el.classList.toggle('pending', st !== 'saved');
    // 閲覧ページは編集中の年度で開く
    $('toViewer').href = `viewer.html?year=${state.startYear}`;
  }

  // ================= 操作 =================
  $('months').addEventListener('click', e => {
    const c = e.target.closest('.day[data-key]');
    if (!c) return;
    const k = c.dataset.key;
    state.overrides.has(k) ? state.overrides.delete(k) : state.overrides.add(k);
    render();
  });

  const yearSel = $('yearSel');
  function addYearOption(y) {
    const o = document.createElement('option');
    o.value = y; o.textContent = t('yearOption', y);
    const after = [...yearSel.options].find(x => +x.value > y);
    yearSel.insertBefore(o, after || null);
  }
  for (let y = 2024; y <= 2045; y++) addYearOption(y);
  const relabelYears = () => [...yearSel.options].forEach(o => { o.textContent = t('yearOption', +o.value); });

  // 年度を開く：保存済みならそれ（閲覧ページと同じ内容）、なければ初期状態。
  // 未保存の年度のサブタイトルは、入力中のもの → いちばん近い保存済み年度のものを引き継ぐ
  function openYear(y) {
    const all = window.JC.loadAll();
    const nearest = Object.values(all).sort((a, b) => Math.abs(a.startYear - y) - Math.abs(b.startYear - y))[0];
    const subtitle = state.subtitle || (nearest ? nearest.subtitle : '');
    setState(all[y] || { startYear: y, title: '', subtitle, overrides: [] });
    render();
  }

  yearSel.addEventListener('change', () => {
    const y = +yearSel.value;
    if (hasUnsavedChanges() && !confirm(t('confirmYear'))) {
      yearSel.value = state.startYear;
      return;
    }
    openYear(y);
  });

  $('titleIn').addEventListener('input', e => {
    state.title = e.target.value;
    state.titleAuto = I.isAutoTitle(state.title, state.startYear);
    render();
  });
  $('subIn').addEventListener('input', e => { state.subtitle = e.target.value; render(); });

  $('resetBtn').addEventListener('click', () => {
    if (!state.overrides.size) { toast(t('noChanges')); return; }
    if (confirm(t('confirmReset'))) {
      state.overrides.clear();
      render();
    }
  });

  $('printBtn').addEventListener('click', () => window.print());

  // ---- QRコードで他のスマホへ渡す（表示中の内容） ----
  $('shareBtn').addEventListener('click', () => window.JC_SHARE.show(toData(), state.titleAuto));

  // ---- 保存（ブラウザ内。閲覧ページと共有） ----
  function save() {
    const ok = !!window.JC.saveCalendar(toData());
    if (ok) toast(t('savedOk', state.startYear));
    else alert(t('saveFailed'));
    render();
    return ok;
  }
  $('saveBtn').addEventListener('click', save);

  // ---- 閲覧ページへ移る前に、未保存の変更があれば確認 ----
  const leaveDlg = $('leaveDlg');
  leaveDlg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => leaveDlg.close(b.value)));
  $('toViewer').addEventListener('click', e => {
    if (!hasUnsavedChanges() || typeof leaveDlg.showModal !== 'function') return;
    e.preventDefault();
    const href = e.currentTarget.href;
    leaveDlg.returnValue = 'cancel';
    leaveDlg.addEventListener('close', () => {
      const choice = leaveDlg.returnValue;
      if (choice === 'save' && !save()) return;
      if (choice === 'save' || choice === 'discard') { leaving = true; location.href = href; }
    }, { once: true });
    leaveDlg.showModal();
  });

  // ---- 他の端末へ移すためのファイル書き出し・読み込み ----
  $('exportBtn').addEventListener('click', () => {
    const name = t('exportName', state.startYear);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(toData(), null, 2)], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(t('exported', name));
  });

  $('importBtn').addEventListener('click', () => $('fileIn').click());
  $('fileIn').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    let d;
    try {
      d = window.JC.normalize(JSON.parse(await f.text()));
    } catch (err) {
      alert(t('loadError'));
      return;
    }
    if (hasUnsavedChanges() && d.startYear !== state.startYear && !confirm(t('confirmYear'))) return;
    setState(d);
    render();
    toast(t('importedDraft', d.startYear));
  });

  // ---- 保存せずにページを閉じる・再読み込みするときはブラウザの確認を出す ----
  let leaving = false;   // 確認ダイアログで移動を選んだ後は出さない
  window.addEventListener('beforeunload', e => {
    if (leaving || !hasUnsavedChanges()) return;
    e.preventDefault();
    e.returnValue = '';
  });

  function syncInputs() {
    yearSel.value = state.startYear;
    $('titleIn').value = state.title;
    $('subIn').value = state.subtitle;
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // 画面幅が狭いときは用紙を縮小表示
  const narrow = window.matchMedia('(max-width: 760px)');
  function fit() {
    const page = $('page');
    page.style.zoom = 1;
    if (narrow.matches) return;
    const w = page.getBoundingClientRect().width;
    const avail = document.documentElement.clientWidth - 32;
    page.style.zoom = w > avail ? (avail / w).toFixed(3) : 1;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('beforeprint', () => { $('page').style.zoom = 1; });
  window.addEventListener('afterprint', fit);

  // ---- 言語切り替え ----
  I.bindSelect($('langSel'));
  I.applyStatic();
  I.onChange(() => {
    relabelYears();
    if (state.titleAuto) { state.title = autoTitle(state.startYear); syncInputs(); }
    render();
  });

  // ---- 初期化：閲覧ページと同じ保存データを開く（?year= があればその年度、なければ今年度） ----
  try { localStorage.removeItem(OLD_DRAFT_KEY); } catch (e) { /* 無視 */ }
  const reqYear = Number(new URLSearchParams(location.search).get('year'));
  openYear(Number.isInteger(reqYear) && reqYear >= 2000 && reqYear <= 2100 ? reqYear : fiscalYearOf());
  fit();
})();
</script>
</body>
</html>
